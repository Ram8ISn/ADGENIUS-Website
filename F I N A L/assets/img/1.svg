<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b4f6c" />
      <stop offset="100%" stop-color="#122a65" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="t" />
      <feColorMatrix in="t" type="saturate" values="0" />
      <feBlend in="SourceGraphic" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="200" cy="120" r="220" />
    <circle cx="1400" cy="780" r="280" />
  </g>
  <g transform="translate(80,220)" fill="#fff" opacity="0.95">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">ADGENIUS</text>
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="28">Creative Digital Agency</text>
  </g>
</svg>
